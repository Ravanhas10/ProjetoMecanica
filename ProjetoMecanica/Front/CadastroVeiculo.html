<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Veículo</title>
    <link rel="stylesheet" href="CadastroVeiculo.css">
</head>

<body>


    <header class="sidebar">

        <nav class="nav-menu">

            <img src="img/Mascote%20Mec%C3%A2nicas%20Car%20em%20Verde.png" alt="Logo Mecânicas Car" class="img-logo" >

            <ul class="lista-menu">

                <li>
                    <a href="menu.html">Inicial</a>
                </li>

                <li>
                    <a href="Agendamentos.html">Agendamentos</a>
                </li>

                <li>
                    <a href="LIstagemDeClientes.html">Listagem de Clientes</a>
                </li>

                <li>
                    <a href="CadastroAgendamento.html">
                        Cadastro de Agendamento
                    </a>
                </li>

                <li>
                    <a href="CadastroVeiculo.html">
                        Cadastro de Veículo
                    </a>
                </li>

                <li>
                    <a href="CadastroCliente.html">
                        Cadastro de Clientes
                    </a>
                </li>

            </ul>

        </nav>

        <div class="perfil">

            <div class="perfil-info">

                <img src="https://pt.dreamstime.com/um-copo-de-leite-engra%C3%A7ado-com-rosto-feliz-personagem-desenho-animado-gerativo-ai-image269929632"
                    alt="Perfil" class="perfil-avatar2">

                <div class="perfil-dados">

                    <span class="perfil-nome">
                        Milk Chan
                    </span>

                    <span class="perfil-cargo">
                        Pro Playler
                    </span>

                </div>

            </div>

            <a href="index.html" class="btn-sair">
                Sair
            </a>

        </div>

    </header>


    <main class="conteudo">

        <h1 class="titulo-cadastro">Cadastro do Veículo</h1>

        <form>

            <section class="card">

                 <label for="Placa">Placa do Veículo</label> 
                 <input type="text" id="Placa" name="Placa" placeholder="Digite a placa do veículo" required>

            </section>

            <section class="card"> 

                <label for="Modelo">Modelo do Veículo</label> 
                <input type="tel" id="Modelo" name="Modelo" placeholder="Digite o modelo do veículo" required> 

            </section>

            <section class="card"> 

                <label for="Marca">Marca do Veículo</label> 
                <input type="text" id="Marca" name="Marca" placeholder="Digite a marca do veículo" required>

            </section>

            <section class="card">

                 <label for="Cor">Cor do Veículo</label> 
                 <input type="text" id="Cor" name="Cor" placeholder="Digite a cor do veículo" required> 

            </section>

            <section class="btn-cadastro">

                 <button type="submit" class="btn-cadastrar"><a href="menu.html">Cadastrar</a></button> 

            </section>

        </form>

    </main>

</body>

</html>
